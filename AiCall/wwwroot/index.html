<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>دستیار صوتی بلادرنگ</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#07111f; color:#e7eef8 }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px }
    main { width:min(760px,100%); background:#101e31; border:1px solid #29405e; border-radius:22px; padding:28px; box-shadow:0 24px 70px #0008 }
    h1 { margin:0 0 6px; font-size:clamp(1.5rem,5vw,2.3rem) } .subtitle { color:#9bb0ca; margin:0 0 24px }
    .state { padding:12px 14px; border-radius:10px; background:#182a42; margin-bottom:18px } .state[data-live=true] { color:#75e5af; background:#123629 }
    .controls,.composer { display:flex; gap:10px; margin-bottom:18px } button,input { border-radius:10px; border:1px solid #385374; padding:12px 16px; font:inherit }
    button { cursor:pointer; background:#2076df; color:white; font-weight:700 } button.secondary { background:#263a54 } button:disabled { opacity:.45; cursor:not-allowed }
    input { flex:1; min-width:0; background:#0b1727; color:white } section { background:#0b1727; border-radius:12px; padding:16px; margin-top:14px }
    h2 { font-size:.85rem; color:#8da5c1; margin:0 0 10px; text-transform:uppercase } #transcript { min-height:70px; white-space:pre-wrap; font-size:1.1rem; line-height:1.8 }
    #events { max-height:170px; overflow:auto; font-family:monospace; direction:ltr; text-align:left; color:#a9bdd4; font-size:.85rem }
    #error { display:none; color:#ffb2b2; background:#471d28 } #error.visible { display:block }
    @media(max-width:540px) { .composer { flex-direction:column } .composer button { width:100% } main { padding:20px } }
  </style>
</head>
<body>
<main>
  <h1>دستیار صوتی بلادرنگ</h1>
  <p class="subtitle">متن فارسی بفرستید و پاسخ صوتی را با صدای marin بشنوید.</p>
  <div id="state" class="state" data-live="false">قطع</div>
  <div class="controls">
    <button id="connect">اتصال</button>
    <button id="disconnect" class="secondary" disabled>قطع اتصال</button>
  </div>
  <form id="composer" class="composer">
    <input id="message" value="سلام از مرورگر" aria-label="پیام" autocomplete="off">
    <button id="send" disabled>ارسال</button>
  </form>
  <section><h2>متن پاسخ</h2><div id="transcript">هنوز پاسخی دریافت نشده است.</div></section>
  <section id="error" role="alert"></section>
  <section><h2>رویدادها</h2><div id="events"></div></section>
</main>
<script>
(() => {
  'use strict';
  const RATE = 24000;
  const $ = id => document.getElementById(id);
  const connectButton=$('connect'), disconnectButton=$('disconnect'), sendButton=$('send');
  const state=$('state'), transcript=$('transcript'), events=$('events'), error=$('error'), message=$('message');
  let socket=null, audioContext=null, nextStartTime=0, transcriptText='';

  function log(text) {
    const line=document.createElement('div'); line.textContent=`${new Date().toLocaleTimeString()}  ${text}`;
    events.append(line); events.scrollTop=events.scrollHeight;
  }
  function setConnectionState(connectionState) {
    const live=connectionState==='connected', connecting=connectionState==='connecting';
    state.dataset.live=String(live);
    state.textContent=live ? 'WebSocket Connected' : connecting ? 'در حال اتصال…' : 'قطع';
    connectButton.disabled=live || connecting;
    disconnectButton.disabled=!live;
    sendButton.disabled=!live;
  }
  function showError(text) { error.textContent=text; error.classList.toggle('visible', Boolean(text)); }
  async function prepareAudio() {
    audioContext ||= new (window.AudioContext || window.webkitAudioContext)({sampleRate:RATE});
    if (audioContext.state==='suspended') await audioContext.resume();
    if (nextStartTime<audioContext.currentTime) nextStartTime=audioContext.currentTime;
  }
  async function playPcm16(arrayBuffer) {
    await prepareAudio();
    const byteLength=arrayBuffer.byteLength-(arrayBuffer.byteLength%2);
    if (!byteLength) return;
    const view=new DataView(arrayBuffer,0,byteLength), samples=byteLength/2;
    const buffer=audioContext.createBuffer(1,samples,RATE), channel=buffer.getChannelData(0);
    for(let i=0;i<samples;i++) channel[i]=view.getInt16(i*2,true)/32768;
    const source=audioContext.createBufferSource(); source.buffer=buffer; source.connect(audioContext.destination);
    const start=Math.max(nextStartTime,audioContext.currentTime+0.04); source.start(start); nextStartTime=start+buffer.duration;
  }
  function handleJson(payload) {
    let event; try { event=JSON.parse(payload); } catch { showError('پیام نامعتبر از سرور دریافت شد.'); return; }
    if (event.type==='transcript.delta') {
      if (!transcriptText) transcript.textContent=''; transcriptText+=event.delta || ''; transcript.textContent=transcriptText;
    } else if (event.type==='status') {
      log(event.message); if (event.message.includes('response started')) { transcriptText=''; transcript.textContent=''; }
    } else if (event.type==='error') { showError(event.message || 'خطای ناشناخته'); log(`ERROR: ${event.message}`); }
  }
  async function connect() {
    if (socket && (socket.readyState===WebSocket.CONNECTING || socket.readyState===WebSocket.OPEN)) return;
    showError(''); await prepareAudio();
    const protocol=location.protocol==='https:' ? 'wss:' : 'ws:';
    const currentSocket=new WebSocket(`${protocol}//${location.host}/api/dental-realtime/connect`);
    socket=currentSocket; currentSocket.binaryType='arraybuffer'; setConnectionState('connecting');
    currentSocket.onopen=()=>{ setConnectionState('connected'); log('WebSocket Connected'); };
    currentSocket.onmessage=event=> event.data instanceof ArrayBuffer
      ? playPcm16(event.data).catch(e=>showError(`خطای پخش صدا: ${e.message}`)) : handleJson(event.data);
    currentSocket.onerror=()=>showError('اتصال WebSocket ناموفق بود. برنامه را از آدرس ASP.NET Core باز کنید و تنظیمات OpenAI را بررسی کنید.');
    currentSocket.onclose=event=>{
      if (socket!==currentSocket) return;
      setConnectionState('disconnected');
      const detail=event.reason ? `: ${event.reason}` : '';
      log(`WebSocket closed (${event.code})${detail}`); socket=null; nextStartTime=0;
    };
  }
  connectButton.onclick=()=>connect().catch(e=>showError(e.message));
  disconnectButton.onclick=()=>socket?.close(1000,'Browser disconnected');
  $('composer').onsubmit=async event=>{
    event.preventDefault(); if (socket?.readyState!==WebSocket.OPEN || !message.value.trim()) return;
    await prepareAudio(); showError(''); socket.send(JSON.stringify({type:'message',message:message.value.trim()})); log(`SEND: ${message.value.trim()}`);
  };
  addEventListener('beforeunload',()=>socket?.close());
})();
</script>
</body>
</html>
